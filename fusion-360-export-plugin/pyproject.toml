[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["A", "ANN", "ARG", "B", "BLE", "C4", "E", "EM", "ERA", "EXE", "F", "FA", "FBT", "G", "I", "ICN", "INP", "ISC", "LOG", "N", "PERF", "PIE", "PL", "PTH", "PYI", "Q", "RET", "RSE", "RUF", "S", "SIM", "SLF", "T10", "T20", "TC", "TRY", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# The host entry boundary reports every failure and its Protocols preserve published API names.
"src/MekatrolModelExporter/entrypoint.py" = ["BLE001", "N802"]
# The host requires the entry module and runtime folder to share the display name; package
# initializers inherit that non-standard parent package name.
"src/MekatrolModelExporter/MekatrolModelExporter.py" = ["N999"]
"src/MekatrolModelExporter/__init__.py" = ["N999"]
"src/MekatrolModelExporter/domain/__init__.py" = ["N999"]
"src/MekatrolModelExporter/infrastructure/__init__.py" = ["N999"]
"src/MekatrolModelExporter/application/__init__.py" = ["N999"]
"src/MekatrolModelExporter/adapters/__init__.py" = ["N999"]
"src/MekatrolModelExporter/adapters/source_application/__init__.py" = ["N999"]
# Development-only declarations preserve the host's published mixed-case API.
"typings/adsk/*.pyi" = ["N802", "N815"]

[tool.ruff.lint.isort]
known-first-party = ["entrypoint"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
