[package]
name = "fusion360-converter"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
# Decode Fusion archives and inspect the resulting model.
cadmpeg-codec-f3d = "=0.6.12"
cadmpeg-ir = "=0.6.12"
# Command-line parsing and structured output.
clap = { version = "4.6.10", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
